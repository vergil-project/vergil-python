name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: base
      container-tag: "latest"
    # The package-released dispatch to vergil-project/packages uses the org
    # GitHub App (APP_CLIENT_ID / APP_PRIVATE_KEY; spec §8.2). Pass only those
    # (least privilege; Semgrep secrets-inherit). Signing secrets come from the
    # main-only `package-signing` environment inside cd-release.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
