name: Epic Rollup

on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  epic-rollup:
    uses: vergil-project/vergil-actions/.github/workflows/ops-epic-rollup.yml@v2.1
    permissions:
      contents: read
    # `inherit` is required: the App keys are `automation` environment
    # secrets, which reach a cross-repo reusable workflow only through
    # `secrets: inherit` (probe in vergil-project/packages#6).
    secrets: inherit
