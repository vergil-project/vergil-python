# The pinned python-build-standalone (PBS) runtime packaged by this repo
# (spec §6.2, decision D7). The CPython patch is exact; the PBS build floats.
#
# Source of every value: the PBS release's SHA256SUMS asset,
#   https://github.com/astral-sh/python-build-standalone/releases/download/<pbs_tag>/SHA256SUMS
# for the asset
#   cpython-<cpython>+<pbs_tag>-<triple>-install_only_stripped.tar.gz
#
# Changing any value here also changes [package].name/version/summary/smoke in
# vergil.toml; packaging/build.sh fails the build if the two disagree. See
# docs/runtime-package-pattern.md.

cpython = "3.14.8"
pbs_tag = "20261013"

[sha256]
x86_64 = "d8faa1b588506b9e3e5a3f57807bb056d534a1641a6b10d15b6ea3f0b413b960"
aarch64 = "d8ae14f303d3971431184cf423ae5467202de2bc19bf6491a490250b87647d4b"
