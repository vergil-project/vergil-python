[project]
repository-type = "infrastructure"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"

[ci]
integration-tests = false

[publish]
release = true
docs = false

[dependencies]
vergil = "v2.1"

# One package per listed series in runtime.toml (epic vergil-project/.github#472,
# spec §5.3). upstream-version holds only the upstream inputs
# (<cpython>+<pbs_tag>); vergil-tooling appends the repo VERSION to form the
# full package version. The upstream-refresh hook rewrites upstream-version and
# summary; packaging/build.sh fails the build if this file and runtime.toml
# disagree.

[[package]]
builder = "staged"
vendor = "vergil"
name = "vergil-python3.14"
upstream-version = "3.14.10+20261026"
summary = "Pinned CPython 3.14.10 (python-build-standalone 20261026) for vergil products"
smoke = "/opt/vergil/python/3.14/bin/python3.14 -c 'import ssl, sqlite3, ctypes, zlib; print(ssl.OPENSSL_VERSION)'"

[package.staged]
build-command = "packaging/build.sh"

[[package]]
builder = "staged"
vendor = "vergil"
name = "vergil-python3.15"
upstream-version = "3.15.2+20261026"
summary = "Pinned CPython 3.15.2 (python-build-standalone 20261026) for vergil products"
smoke = "/opt/vergil/python/3.15/bin/python3.15 -c 'import ssl, sqlite3, ctypes, zlib; print(ssl.OPENSSL_VERSION)'"

[package.staged]
build-command = "packaging/build.sh"

[upstream-refresh]
hook = "scripts/dev/upstream-refresh.sh"
