name: Ops

on:
  schedule:
    - cron: '26 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    # `inherit` is required: the App keys are `automation` environment
    # secrets, which reach a cross-repo reusable workflow only through
    # `secrets: inherit` (probe in vergil-project/packages#6).
    secrets: inherit

  # Runs vrg-upstream-refresh (epics vergil-project/.github#472 and #1168). The
  # [upstream-refresh].hook in vergil.toml refreshes each listed series in
  # runtime.toml to its newest patch. The path fence checks the change against
  # [upstream-refresh].paths, then the job opens a PR on a new
  # `automation/upstream-refresh/<run-id>` branch and merges it once CI passes,
  # as the org automation App; no human merges it. A run is red when the fence
  # refuses the change or the PR does not merge. A refresh never removes a
  # series: dropping one is a human change. The App token is minted inside the
  # reusable workflow, so this job's GITHUB_TOKEN needs only contents: read.
  # Its App keys are `automation` environment secrets, passed with `inherit`
  # as for github-config above.
  upstream-refresh:
    uses: vergil-project/vergil-actions/.github/workflows/ops-upstream-refresh.yml@v2.1
    permissions:
      contents: read
    secrets: inherit
