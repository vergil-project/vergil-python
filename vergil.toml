[project]
repository-type = "infrastructure"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"

[ci]
versions = ["latest"]
integration-tests = false

[publish]
release = true
docs = false

[dependencies]
vergil = "v2.1"

[package]
builder = "staged"
vendor = "vergil"
name = "vergil-python3.15"
version = "3.15.1+20261021"
summary = "Pinned CPython 3.15.1 (python-build-standalone 20261021) for vergil products"
smoke = "/opt/vergil/python/3.15/bin/python3.15 -c 'import ssl, sqlite3, ctypes, zlib; print(ssl.OPENSSL_VERSION)'"

[package.staged]
build-command = "packaging/build.sh"

[dependency-update]
hook = "scripts/dev/update-deps.sh"
